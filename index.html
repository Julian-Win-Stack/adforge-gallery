  const vbar = el("div", { class: "versions" });
  function setVersion(v) {
    player.src = src(a.key, v.file); player.dataset.v = String(v.version);
    vbar.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(v.version))));
  }
  if (ads.length > 1) ads.forEach(v => {
    const b = el("button", { type: "button", "data-v": String(v.version), "aria-pressed": String(v === latest),
      text: v.version === 1 ? "First cut" : (a.notes && a.notes.length ? "After owner note" : "Re-cut") + " (v" + v.version + ")" });
    b.addEventListener("click", () => setVersion(v)); vbar.append(b);
  });

  const info = el("div", { class: "info" },
    el("div", { class: "meta" }, el("span", { class: "chip", text: a.set === "new" ? "New product" : "Rerun" }),
      a.late ? el("span", { class: "chip late", text: "Made after the run" }) : null,
      el("a", { href: a.url, target: "_blank", rel: "noopener", text: a.url.replace(/^https?:\/\/(www\.)?/, "").replace(/[?#].*$/, "") })),
    el("h2", { text: a.product }),
    gradeBox(a),
    el("span", { class: "label", text: a.scenes.length + " scenes · " + latest.seconds.toFixed(1) + " s" }),
    scenes);

  if (a.notes && a.notes.length) {
    const box = el("section", { class: "notes" }, el("span", { class: "label", text: "Owner notes" }));
    a.notes.forEach(n => {
      const note = el("div", { class: "note" }, el("h3", { text: "Scene " + n.scene }), el("blockquote", { text: n.text }),
        n.before_words ? el("p", { class: "words", text: "My grade on the first clip: “" + n.before_words + "”" }) : null);
      if (n.after_file) note.append(el("div", { class: "pair" },
        el("figure", {}, el("figcaption", { text: "Before" }), video(a.key, n.before_file)),
        el("figure", {}, el("figcaption", { text: "After" }), video(a.key, n.after_file))));
      else if (n.unchanged) note.append(el("p", { class: "unchanged", text: n.unchanged }));
      box.append(note);
    });
    info.append(box);
  }
  return el("article", { class: "ad", id: a.key }, el("div", { class: "player" }, player, ads.length > 1 ? vbar : null), info);
}

const main = document.getElementById("ads");
[["New products", "15 products AdForge had never seen, picked before the run.", newSet],
 ["Reruns", "7 products whose round-5 ads failed, run again on the current app.", reruns]].forEach(([t, p, list]) => {
  const ok = list.filter(a => a.made).sort((x, y) => (y.key === BEST) - (x.key === BEST) || (x.late ? 1 : 0) - (y.late ? 1 : 0));
  if (!ok.length) return;
  main.append(el("div", { class: "set-title" }, el("h2", { text: t }), el("p", { text: p })));
  ok.forEach(a => main.append(adBlock(a)));
});
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
